[pytest]
testpaths = tests
markers =
    live_llm: tests that call the real LLM (deselected by default; run with `pytest -m live_llm`)
    smoke: a small live-LLM smoke subset (run with `pytest -m smoke`)
# By default `pytest` never calls the real model: conftest forces LLM_TEST_MODE=disabled
# and live_llm-marked tests are deselected here. Run them explicitly when you mean to.
addopts = -m "not live_llm"
