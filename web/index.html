<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LLM-Wiki</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f5f7fb}
*{box-sizing:border-box} body{margin:0} button,input,textarea,select{font:inherit} button{cursor:pointer;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:8px 12px} button.primary{background:#111827;color:#fff;border-color:#111827} button.danger{color:#b91c1c}.layout{display:grid;grid-template-columns:270px 1fr;min-height:100vh}.sidebar{background:#fff;border-right:1px solid #e5e7eb;padding:16px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:22px;font-weight:750;margin-bottom:16px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.nav button.active{background:#111827;color:#fff}.content{padding:24px;max-width:1300px;width:100%}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.muted{color:#64748b}.title{font-size:26px;font-weight:750;margin:0 0 10px}.sub{font-size:14px;color:#64748b}.list{display:flex;flex-direction:column;gap:6px}.list .row{padding:9px;border-radius:8px;cursor:pointer}.list .row:hover{background:#f8fafc}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{display:inline-flex;padding:3px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.status{background:#f1f5f9}.editor input,.editor textarea{width:100%;border:1px solid #cbd5e1;border-radius:8px;padding:10px;margin:6px 0}.editor textarea{min-height:260px;resize:vertical}.result{padding:12px 0;border-top:1px solid #eef2f5}.result:first-child{border-top:0}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.pre{white-space:pre-wrap;background:#f8fafc;padding:12px;border-radius:8px;line-height:1.55}.empty{padding:32px;text-align:center;color:#94a3b8}.graph{width:100%;min-height:420px;border:1px solid #e5e7eb;border-radius:8px;background:#fbfcfe}.two-col{display:grid;grid-template-columns:1fr 380px;gap:16px}.sidepanel{max-height:560px;overflow:auto}.citation{border-left:3px solid #cbd5e1;padding-left:10px;margin:8px 0}.small{font-size:12px}.markdown{white-space:pre-wrap;line-height:1.6}
@media(max-width:900px){.layout{grid-template-columns:1fr}.sidebar{position:static;height:auto}.two-col,.grid,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
<aside class="sidebar">
  <div class="brand">🧠 LLM-Wiki</div>
  <div class="sub">Local-first Personal Knowledge Base</div>
  <div class="nav">
    <button data-view="home">Home</button><button data-view="notes">Notes</button><button data-view="search">Search</button><button data-view="entities">Graph</button><button data-view="review">Review</button><button data-view="ask">Ask</button><button data-view="agent">🤖 Agent</button><button data-view="runs">🧾 Runs</button><button data-view="prompts">📝 Prompts</button><button data-view="settings">⚙ Settings</button>
  </div>
  <div class="card"><div class="row"><strong>Documents</strong><button onclick="newNote()">＋</button></div><div id="docList" class="list" style="margin-top:8px"></div></div>
</aside>
<main class="content" id="app"></main>
</div>
<script>
const app=document.getElementById('app'); let state={view:'home'};
const api=async (url,opt)=>{
  const r=await fetch(url,opt);
  const text=await r.text();
  let j=null;
  try{j=text?JSON.parse(text):null}catch(_){j=null}
  if(!r.ok){
    const detail=(j&&typeof j==='object'&&(j.detail||j.message))||text||(`HTTP ${r.status}`);
    throw new Error(String(detail));
  }
  if(j===null && text) throw new Error(`Server returned non-JSON response: ${text.slice(0,500)}`);
  return j;
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadDocs(){const docs=await api('/api/documents');document.getElementById('docList').innerHTML=docs.map(d=>`<div class="row" onclick="openDoc('${d.id}')"><span>${esc(d.title)}</span><span class="small muted">${esc(d.source_type)}</span></div>`).join('')||'<div class="empty">No documents</div>'}
function nav(view){state.view=view;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));render()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>nav(b.dataset.view));
function newNote(){nav('notes');setTimeout(()=>document.getElementById('title')?.focus(),50)}
async function openDoc(id){const d=await api('/api/documents/'+id);app.innerHTML=`<div class="toolbar"><button onclick="nav('notes')">← Back</button><button class="primary" onclick="indexDoc('${id}')">Index with LLM</button><button onclick="localIndex('${id}')">Build chunks only</button><button onclick="embedDoc('${id}')">Generate embeddings</button></div><div class="card"><h1 class="title">${esc(d.title)}</h1><div class="sub">${esc(d.source_type)} · ${esc(d.id)}</div><div class="pre markdown">${esc(d.content)}</div></div><div id="docAction"></div>`}
async function indexDoc(id){showBusy('Running LLM extraction…');try{const x=await api('/api/documents/'+id+'/index',{method:'POST'});showResult(x)}catch(e){showError(e)}}
async function localIndex(id){showBusy('Building chunks…');try{const x=await api('/api/documents/'+id+'/index/local',{method:'POST'});showResult(x)}catch(e){showError(e)}}
async function embedDoc(id){showBusy('Generating embeddings…');try{const x=await api('/api/documents/'+id+'/embed',{method:'POST'});showResult(x)}catch(e){showError(e)}}
function showBusy(t){document.getElementById('docAction')?.replaceChildren(Object.assign(document.createElement('div'),{className:'card',innerHTML:`<strong>${esc(t)}</strong>`}))}
function showResult(x){document.getElementById('docAction').innerHTML=`<div class="card"><h3>Result</h3><div class="pre">${esc(JSON.stringify(x,null,2))}</div></div>`;loadDocs()}
function showError(e){document.getElementById('docAction').innerHTML=`<div class="card"><strong>Error</strong><div class="pre">${esc(e.message)}</div></div>`}
function render(){if(state.view==='home')renderHome();if(state.view==='notes')renderNotes();if(state.view==='search')renderSearch();if(state.view==='entities')renderEntities();if(state.view==='review')renderReview();if(state.view==='ask')renderAsk();if(state.view==='agent')renderAgent();if(state.view==='runs')renderRuns();if(state.view==='prompts')renderPrompts();if(state.view==='settings')renderSettings()}
function renderHome(){app.innerHTML=`<div class="card"><h1 class="title">Personal Knowledge Base</h1><p>Document → Chunk → Candidate Knowledge → Retrieval → Reasoning</p><div class="grid3"><div class="card"><strong>Raw</strong><div class="sub">Documents & chunks</div></div><div class="card"><strong>Ontology</strong><div class="sub">Entities, claims, relations</div></div><div class="card"><strong>AI</strong><div class="sub">Hybrid retrieval + grounded answers</div></div></div></div>`}
function renderNotes(){app.innerHTML=`<div class="card editor"><h1 class="title">New note</h1><input id="title" placeholder="Title"><select id="source" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px"><option value="note">note</option><option value="markdown">markdown</option><option value="text">text</option></select><textarea id="body" placeholder="Write Markdown…"></textarea><div class="toolbar"><button class="primary" onclick="saveNote()">Save</button><label style="border:1px solid #cbd5e1;border-radius:8px;padding:8px 12px;cursor:pointer">Import file <input id="file" type="file" accept=".md,.markdown,.txt,.html,.htm" style="display:none" onchange="importFile()"></label></div></div>`}
async function saveNote(){try{const x=await api('/api/documents',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.getElementById('title').value,content:document.getElementById('body').value,source_type:document.getElementById('source').value})});await loadDocs();openDoc(x.id)}catch(e){alert(e.message)}}
async function importFile(){const f=document.getElementById('file').files[0];if(!f)return;const fd=new FormData();fd.append('file',f);try{const x=await api('/api/documents/import',{method:'POST',body:fd});await loadDocs();openDoc(x.id)}catch(e){alert(e.message)}}
function renderSearch(){app.innerHTML=`<div class="card"><h1 class="title">Search</h1><div class="row"><input id="q" style="flex:1;padding:10px;border:1px solid #cbd5e1;border-radius:8px" placeholder="Search your knowledge…" onkeydown="if(event.key==='Enter')doSearch()"><button class="primary" onclick="doSearch()">Search</button></div><div id="searchResults"></div></div>`}
async function doSearch(){const q=document.getElementById('q').value;if(!q)return;const r=await api('/api/search?q='+encodeURIComponent(q)+'&limit=12&semantic=true');document.getElementById('searchResults').innerHTML=r.map(x=>`<div class="result" onclick="openDoc('${x.document_id}')"><div class="row"><strong>${esc(x.title)}</strong><span class="pill">${esc(x.method)} ${Number(x.score||0).toFixed(4)}</span></div><div class="small muted">${esc(x.content.slice(0,320))}</div></div>`).join('')||'<div class="empty">No results</div>'}
async function renderEntities(){app.innerHTML=`<div class="two-col"><div class="card"><div class="row"><h1 class="title">Ontology / Graph</h1><button onclick="renderEntities()">Refresh</button></div><div id="entitiesList"></div></div><div class="card sidepanel" id="entityPanel"><div class="empty">Select an entity</div></div></div>`;const es=await api('/api/entities?limit=200');document.getElementById('entitiesList').innerHTML=es.map(e=>`<div class="result"><div class="row"><div onclick="showEntity('${e.id}')" style="cursor:pointer"><strong>${esc(e.name)}</strong> <span class="pill">${esc(e.type)}</span></div><span class="small">${esc(e.status)}</span></div><div class="small muted">${esc(e.description||'')}</div></div>`).join('')||'<div class="empty">No entities yet</div>'}
async function showEntity(id){const [e,g]=await Promise.all([api('/api/entities/'+id),api('/api/entities/'+id+'/graph?depth=1&limit=100')]);document.getElementById('entityPanel').innerHTML=`<h2>${esc(e.name)}</h2><div class="sub">${esc(e.type)} · ${esc(e.status)}</div><p>${esc(e.description||'')}</p><h3>Claims</h3>${(e.claims||[]).map(c=>`<div class="citation">${esc(c.content||'')} <span class="small muted">[${esc(c.id)}]</span></div>`).join('')||'<div class="muted">No claims</div>'}<h3>Graph</h3><svg id="graphSvg" class="graph" viewBox="0 0 700 420"></svg><details style="margin-top:8px"><summary>Raw graph JSON</summary><div class="pre mono">${esc(JSON.stringify(g,null,2))}</div></details>`; drawGraph(g);}
async function renderReview(){app.innerHTML=`<div class="card"><div class="row"><h1 class="title">Review candidates</h1><button onclick="renderReview()">Refresh</button></div><div id="review"></div></div>`;const r=await api('/api/review?limit=100');let html='';for(const kind of ['entities','claims','relations']){html+=`<h3>${kind}</h3>`;html+=(r[kind]||[]).map(x=>`<div class="result"><div>${esc(x.name||x.content||x.predicate||'')}</div><div class="toolbar"><button onclick="setStatus('${kind.slice(0,-1)}','${x.id}','verified')">Verify</button><button class="danger" onclick="setStatus('${kind.slice(0,-1)}','${x.id}','rejected')">Reject</button></div></div>`).join('')||'<div class="muted">None</div>'}document.getElementById('review').innerHTML=html}
async function setStatus(kind,id,status){try{await api(`/api/knowledge/${kind}/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});renderReview()}catch(e){alert(e.message)}}
async function renderAgent(){
  app.innerHTML=`<div class="card"><h1 class="title">AgentScope Agent</h1><p class="sub">AgentScope 2.x ReAct Agent can search your LLM-Wiki knowledge base and inspect entity graphs before answering.</p><select id="agentRole" style="margin-bottom:12px"><option value="auto">Auto route</option><option value="personal">PersonalAgent</option><option value="knowledge">KnowledgeAgent</option><option value="research">ResearchAgent</option><option value="curator">CuratorAgent</option><option value="review">ReviewAgent</option></select><textarea id="agentInput" rows=8 placeholder="Ask your knowledge system…"></textarea><div class="toolbar" style="margin-top:12px"><button class="primary" onclick="runAgent()">Run Agent</button></div><div id="agentResult" style="margin-top:16px"></div></div>`;
}
async function runAgent(){const msg=document.getElementById('agentInput').value.trim();if(!msg)return;document.getElementById('agentResult').innerHTML='<div class="card">Running AgentScope…</div>';try{const r=await api('/api/agent/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,role:document.getElementById('agentRole').value})});document.getElementById('agentResult').innerHTML=`<div class="card"><div><strong>${esc(r.agent||'')}</strong></div><div class="pre" style="margin-top:8px">${esc(r.answer||'')}</div></div>`}catch(e){document.getElementById('agentResult').innerHTML=`<div class="card"><strong>Error</strong><div class="pre">${esc(e.message)}</div></div>`}}

async function renderPrompts(){
  app.innerHTML=`<div class="card"><h1 class="title">Agent Prompts</h1><p class="sub">每个 Agent 都有不可覆盖的 Core Contract 与 Skill。这里编辑的是用户自定义指令；保存后立即对新的 Agent 请求生效。</p><div class="grid"><div><label>Agent</label><select id="promptRole" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px" onchange="loadPromptProfile()"></select></div><div><label>Version history</label><div id="promptHistoryCount" class="pre" style="padding:10px">—</div></div></div><div id="promptMeta" style="margin-top:14px"></div><div style="margin-top:14px"><label>Custom instructions</label><textarea id="customPrompt" style="width:100%;min-height:280px;border:1px solid #cbd5e1;border-radius:8px;padding:10px" placeholder="例如：回答尽量简洁；先给结论，再给证据。"></textarea></div><div class="toolbar" style="margin-top:12px"><button class="primary" onclick="savePromptProfile()">Save prompt</button><button onclick="resetPromptProfile()">Reset to default</button><button onclick="togglePromptPreview()">Preview effective prompt</button></div><div id="promptResult"></div><div id="promptPreview" style="display:none;margin-top:12px"></div></div>`;
  try{const x=await api('/api/agent/prompts');document.getElementById('promptRole').innerHTML=x.profiles.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('');await loadPromptProfile();}catch(e){showError(e)}
}
async function loadPromptProfile(){const role=document.getElementById('promptRole').value;if(!role)return;try{const p=await api('/api/agent/prompts/'+role);document.getElementById('customPrompt').value=p.custom_prompt||'';document.getElementById('promptHistoryCount').textContent=(p.history||[]).length+' saved versions';document.getElementById('promptMeta').innerHTML=`<div class="sub"><strong>${esc(p.name)}</strong> · ${esc(p.description)}<br>Skill: ${esc(p.skill||'none')} · Editable scope: ${esc(p.editable_scope)}</div>`;document.getElementById('promptResult').innerHTML='';document.getElementById('promptPreview').style.display='none';}catch(e){document.getElementById('promptResult').innerHTML=`<div class="card"><strong>Error</strong><div class="pre">${esc(e.message)}</div></div>`}}
async function savePromptProfile(){const role=document.getElementById('promptRole').value;const custom=document.getElementById('customPrompt').value;try{await api('/api/agent/prompts/'+role,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({custom_prompt:custom,note:'edited in UI'})});document.getElementById('promptResult').innerHTML='<div class="card"><strong>Saved.</strong> New agent requests use the updated prompt immediately.</div>';await loadPromptProfile();}catch(e){document.getElementById('promptResult').innerHTML=`<div class="card"><strong>Error</strong><div class="pre">${esc(e.message)}</div></div>`}}
async function resetPromptProfile(){const role=document.getElementById('promptRole').value;if(!confirm('Reset this Agent custom prompt?'))return;try{await api('/api/agent/prompts/'+role+'/reset',{method:'POST'});await loadPromptProfile();document.getElementById('promptResult').innerHTML='<div class="card">Reset to default.</div>';}catch(e){document.getElementById('promptResult').innerHTML=`<div class="card"><strong>Error</strong><div class="pre">${esc(e.message)}</div></div>`}}
async function togglePromptPreview(){const role=document.getElementById('promptRole').value;const el=document.getElementById('promptPreview');if(el.style.display!=='none'){el.style.display='none';return}try{const p=await api('/api/agent/prompts/'+role);el.innerHTML=`<h3>Effective prompt preview</h3><div class="pre mono">${esc(p.effective_prompt_preview||'')}</div>`;el.style.display='block';}catch(e){el.innerHTML=`<div class="card"><strong>Error</strong><div class="pre">${esc(e.message)}</div></div>`;el.style.display='block'}}
async function renderSettings(){
  app.innerHTML=`<div class="card"><h1 class="title">Settings</h1><p class="sub">Configure the LLM, embedding model, API endpoint and SQLite database path. Settings are stored locally in data/settings.json.</p><div id="settingsForm">Loading…</div></div>`;
  try{const c=await api('/api/settings');document.getElementById('settingsForm').innerHTML=`
  <div class="grid">
    <div><label>LLM API Base URL</label><input id="base" value="${esc(c.openai_base_url)}" placeholder="https://api.openai.com/v1"></div>
    <div><label>LLM Model</label><input id="model" value="${esc(c.openai_model)}" placeholder="gpt-4.1-mini"></div>
    <div><label>Embedding Model</label><input id="embed" value="${esc(c.openai_embedding_model)}" placeholder="text-embedding-3-small"></div>
    <div><label>Embedding Dimensions</label><input id="dims" type="number" value="${esc(c.embedding_dims)}"></div>
    <div><label>API Key</label><input id="key" type="password" placeholder="${c.openai_api_key_configured?'Configured — leave blank to keep it':'Enter API key'}"></div>
    <div><label>SQLite DB Path</label><input id="db" value="${esc(c.database_path)}" placeholder="./data/wiki.db"></div>
    <div><label>LLM Batch Chunks</label><input id="batch" type="number" value="${esc(c.llm_batch_chunks)}"></div>
    <div><label>Max Search Results</label><input id="max" type="number" value="${esc(c.max_search_results)}"></div>
  </div>
  <div style="margin-top:12px"><label><input id="auto" type="checkbox" ${c.auto_embed?'checked':''}> Automatically generate embeddings after indexing</label><br><label><input id="agentEnabled" type="checkbox" ${c.agentscope_enabled!==false?'checked':''}> Enable AgentScope 2.x</label></div>
  <div class="toolbar" style="margin-top:18px"><button class="primary" onclick="saveSettings()">Save settings</button><button onclick="testSettings()">Test connection</button></div><div id="settingsResult"></div>`}catch(e){showError(e)}
}
async function saveSettings(){const payload={openai_base_url:document.getElementById('base').value.trim(),openai_model:document.getElementById('model').value.trim(),openai_embedding_model:document.getElementById('embed').value.trim(),embedding_dims:Number(document.getElementById('dims').value),database_path:document.getElementById('db').value.trim(),llm_batch_chunks:Number(document.getElementById('batch').value),max_search_results:Number(document.getElementById('max').value),auto_embed:document.getElementById('auto').checked,agentscope_enabled:document.getElementById('agentEnabled').checked};const key=document.getElementById('key').value;if(key)payload.openai_api_key=key;try{const c=await api('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});document.getElementById('settingsResult').innerHTML='<div class="card"><strong>Saved.</strong> Database and model settings are active immediately.</div>';document.getElementById('key').value='';}catch(e){document.getElementById('settingsResult').innerHTML=`<div class="card"><strong>Error</strong><div class="pre">${esc(e.message)}</div></div>`}}
async function testSettings(){try{const h=await api('/api/health');document.getElementById('settingsResult').innerHTML=`<div class="card"><strong>Current runtime</strong><div class="pre mono">${esc(JSON.stringify(h,null,2))}</div></div>`}catch(e){alert(e.message)}}
function renderAsk(){app.innerHTML=`<div class="card"><h1 class="title">Ask your knowledge base</h1><textarea id="question" style="width:100%;min-height:120px;border:1px solid #cbd5e1;border-radius:8px;padding:10px" placeholder="What did I previously think about RAG vs Fine-tuning?"></textarea><div class="toolbar"><button class="primary" onclick="ask()">Ask</button></div><div id="answer"></div></div>`}
async function ask(){const q=document.getElementById('question').value;if(!q)return;document.getElementById('answer').innerHTML='<div class="card">Thinking…</div>';try{const x=await api('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q,top_k:8})});document.getElementById('answer').innerHTML=`<div class="card"><h3>Answer</h3><div class="pre">${esc(x.answer)}</div><h3>Evidence</h3>${(x.evidence||[]).map(e=>`<div class="citation"><strong>${esc(e.title)}</strong><div class="small">doc:${esc(e.document_id)} chunk:${esc(e.id)}</div><div>${esc(e.content)}</div></div>`).join('')}</div>`}catch(e){showError(e)}}
function tsFmt(s){if(!s)return '—';const iso=/(?:Z|[+-]\d{2}:?\d{2})$/i.test(s)?s:s.replace(' ','T')+'Z';const d=new Date(iso);if(isNaN(d.getTime()))return s;return new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).format(d).replace(/\//g,'-')}
async function renderRuns(){
  app.innerHTML=`<div class="card"><div class="row"><h1 class="title">Task Runs</h1><button onclick="renderRuns()">Refresh</button></div><div class="row" style="margin:10px 0"><select id="runType" onchange="renderRuns()"><option value="">All types</option><option value="extract">extract</option><option value="ask">ask</option><option value="agent">agent</option></select></div><div id="runList" class="list"></div><div id="runDetail"></div></div>`;
  const t=document.getElementById('runType').value;
  try{
    const runs=await api('/api/runs?limit=50'+(t?'&task_type='+t:''));
    document.getElementById('runList').innerHTML=runs.map(r=>`<div class="result" style="cursor:pointer" onclick="showRun('${r.id}')"><div class="row"><strong>${esc(r.task_type)}</strong><span class="pill ${r.status==='failed'?'':'status'}">${esc(r.status)}</span><span class="small muted">${esc(r.document_title||r.agent_role||'')}</span></div><div class="small muted">${esc(tsFmt(r.created_at))} · ${r.step_count} steps · ${r.duration_ms??'—'} ms${r.error_message?' · '+esc(r.error_message.slice(0,120)):''}</div></div>`).join('')||'<div class="empty">No runs yet</div>';
  }catch(e){document.getElementById('runList').innerHTML=`<div class="card"><strong>Error</strong><div class="pre">${esc(e.message)}</div></div>`}
}
async function showRun(id){
  document.getElementById('runDetail').innerHTML='<div class="card">Loading…</div>';
  try{
    const r=await api('/api/runs/'+id);
    document.getElementById('runDetail').innerHTML=`<div class="card"><h3>Run detail</h3><div class="sub">${esc(r.task_type)} · ${esc(r.status)} · ${esc(r.model||'')} · ${r.duration_ms??'—'} ms</div><div class="pre mono" style="margin-top:8px">${esc(JSON.stringify(r.summary,null,2))}</div>${(r.steps||[]).map(s=>`<div class="result"><div class="row"><strong>${esc(s.name)}</strong><span class="pill ${s.status==='failed'?'':'status'}">${esc(s.status)}</span><span class="small muted">${s.duration_ms??'—'} ms</span></div><div class="small muted">${esc(s.input_summary||'')}</div>${s.error_message?`<div class="pre" style="color:#b91c1c">${esc(s.error_message)}</div>`:''}<details style="margin-top:6px"><summary>LLM output</summary><div class="pre mono">${esc(s.output_text||'(none)')}</div></details></div>`).join('')||'<div class="muted">No steps</div>'}</div>`;
  }catch(e){document.getElementById('runDetail').innerHTML=`<div class="card"><strong>Error</strong><div class="pre">${esc(e.message)}</div></div>`}
}
function drawGraph(g){const svg=document.getElementById('graphSvg');if(!svg)return;svg.innerHTML='';const ns='http://www.w3.org/2000/svg';const nodes=g.nodes||[];const edges=g.edges||[];const cx=350,cy=210,r=Math.max(90,Math.min(160,35*nodes.length));const pos={};nodes.forEach((n,i)=>{const a=(Math.PI*2*i/Math.max(nodes.length,1))-Math.PI/2;pos[n.id]={x:cx+r*Math.cos(a),y:cy+r*Math.sin(a)};});edges.filter(e=>e.source_id&&e.target_id).forEach(e=>{const a=pos[e.source_id],b=pos[e.target_id];if(!a||!b)return;const line=document.createElementNS(ns,'line');line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);line.setAttribute('x2',b.x);line.setAttribute('y2',b.y);line.setAttribute('stroke','#94a3b8');line.setAttribute('stroke-width','1.5');svg.appendChild(line);const t=document.createElementNS(ns,'text');t.setAttribute('x',(a.x+b.x)/2);t.setAttribute('y',(a.y+b.y)/2-4);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','11');t.textContent=e.predicate||'';svg.appendChild(t);});nodes.forEach(n=>{const p=pos[n.id];const c=document.createElementNS(ns,'circle');c.setAttribute('cx',p.x);c.setAttribute('cy',p.y);c.setAttribute('r',24);c.setAttribute('fill','#fff');c.setAttribute('stroke','#334155');c.setAttribute('stroke-width','1.5');c.style.cursor='pointer';c.onclick=()=>showEntity(n.id);svg.appendChild(c);const t=document.createElementNS(ns,'text');t.setAttribute('x',p.x);t.setAttribute('y',p.y+4);t.setAttribute('text-anchor','middle');t.setAttribute('font-size','11');t.textContent=(n.name||'').slice(0,14);svg.appendChild(t);});}
loadDocs();nav('home');
